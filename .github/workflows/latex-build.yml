name: Build LaTeX

on:
  push:
    branches: [ main, master, MAIN ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, MAIN ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean any stale artifacts from checkout
        shell: bash
        run: |
          # Remove any auxiliary files that might have been accidentally committed
          # Using single line find to avoid shell syntax issues with multiline splitting
          find . -type f \( -name "*.aux" -o -name "*.bbl" -o -name "*.bcf" -o -name "*.blg" -o -name "*.fls" -o -name "*.log" -o -name "*.out" -o -name "*.toc" -o -name "*.fdb_latexmk" -o -name "*.synctex.gz" \) -delete
          echo "Cleaned stale auxiliary files"

      - name: Restore PDF cache
        uses: actions/cache@v4
        id: pdf-cache
        with:
          path: .pdf-cache
          key: pdf-cache-${{ hashFiles('school-macros.sty') }}-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            pdf-cache-${{ hashFiles('school-macros.sty') }}-
            pdf-cache-

      - name: Find and Build LaTeX documents
        shell: bash
        run: |
          # Create cache directory if it doesn't exist
          mkdir -p .pdf-cache
          
          # Find all main documents (excluding subfiles and templates)
          # We look for files containing \documentclass
          find . -type f -name "*.tex" \
            ! -path "*/.git/*" \
            ! -path "*/assets/*" \
            ! -name "school-macros.sty" \
            ! -name "*-macros.sty" \
            ! -name "Examenoefening.tex" \
            ! -name "OLD-document.tex" \
            -exec grep -l "\\documentclass" {} \; > main_docs.txt
          
          echo "## Build Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Document | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          
          BUILD_FAILED=0
          PDFS_GENERATED=0
          CACHE_HITS=0
          BUILD_LOG_DIR="${GITHUB_WORKSPACE}/build_logs"
          mkdir -p "$BUILD_LOG_DIR"
          
          # Compute hash of root school-macros.sty for cache invalidation
          MACROS_HASH=""
          if [ -f "school-macros.sty" ]; then
            MACROS_HASH=$(sha256sum "school-macros.sty" | cut -d' ' -f1)
          fi
          
          # Build each found document
          while IFS= read -r texfile; do
            dir=$(dirname "$texfile")
            file=$(basename "$texfile")
            name=$(basename "$texfile" .tex)
            
            # Compute hash of the tex file + macros for cache key
            TEX_HASH=$(sha256sum "$texfile" | cut -d' ' -f1)
            CACHE_KEY="${TEX_HASH}-${MACROS_HASH}"
            CACHE_FILE=".pdf-cache/${name}-${CACHE_KEY}.pdf"
            
            # Check if we have a cached PDF
            if [ -f "$CACHE_FILE" ]; then
              echo "========================================="
              echo "Using cached PDF for: $texfile"
              echo "========================================="
              
              # Copy cached PDF to the document's directory
              cp "$CACHE_FILE" "${dir}/${name}.pdf"
              
              echo "| \`$name\` | ⚡ Cached | No changes detected |" >> $GITHUB_STEP_SUMMARY
              echo "⚡ Cache hit: $texfile"
              PDFS_GENERATED=$((PDFS_GENERATED + 1))
              CACHE_HITS=$((CACHE_HITS + 1))
              continue
            fi
            
            echo "========================================="
            echo "Building: $texfile"
            echo "========================================="
            
            cd "$dir"
            
            # Clean auxiliary files specifically using latexmk before building
            # latexmk might fail if it can't find files, so we suppress errors
            latexmk -C "$file" || true
            
            # Build using ONLY latexmk
            if latexmk -pdf \
                -g \
                -shell-escape \
                -interaction=nonstopmode \
                -file-line-error \
                "$file" 2>&1 | tee "build_${name}.log"; then
              
              # Verify PDF was actually created
              if [ -f "${name}.pdf" ]; then
                echo "| \`$name\` | ✅ Built | PDF generated |" >> $GITHUB_STEP_SUMMARY
                echo "✅ Success: $texfile"
                PDFS_GENERATED=$((PDFS_GENERATED + 1))
                
                # Store in cache for future builds
                cp "${name}.pdf" "${GITHUB_WORKSPACE}/${CACHE_FILE}"
              else
                echo "| \`$name\` | ⚠️ Warning | Completed but no PDF |" >> $GITHUB_STEP_SUMMARY
                echo "⚠️ Warning: $texfile completed but PDF not found"
                BUILD_FAILED=1
              fi
            else
              EXIT_CODE=$?
              echo "| \`$name\` | ❌ Failed | Exit code: $EXIT_CODE |" >> $GITHUB_STEP_SUMMARY
              echo "❌ Failed: $texfile (exit code: $EXIT_CODE)"
              
              # Extract and display key error information for the Actions UI
              echo "::group::Error details for $name"
              echo "Last 30 lines of build log:"
              tail -30 "build_${name}.log" || true
              
              if [ -f "${name}.log" ]; then
                echo ""
                echo "LaTeX errors found in .log file:"
                grep -A 3 "^!" "${name}.log" || echo "No '!' markers found in .log"
              fi
              echo "::endgroup::"
              
              BUILD_FAILED=1
            fi
            
            # Move log to central dir for artifact collection
            cp "build_${name}.log" "$BUILD_LOG_DIR/" 2>/dev/null || true
            
            cd - > /dev/null
          done < main_docs.txt
          
          # Summary
          echo ""
          echo "📊 Build Summary: $PDFS_GENERATED PDFs ($CACHE_HITS from cache, $((PDFS_GENERATED - CACHE_HITS)) rebuilt)"
          
          # Logic: Fail only if NO PDFs were generated (and we found documents)
          # If we generated at least one PDF, we consider it a partial success
          if [ $PDFS_GENERATED -eq 0 ]; then
             if [ -s main_docs.txt ]; then
                echo "::error::Build failed: No PDFs were successfully generated from the found documents."
                exit 1
             else
                echo "::warning::No LaTeX documents found to build."
             fi
          elif [ $BUILD_FAILED -ne 0 ]; then
             echo "::warning::Some documents failed to build, but $PDFS_GENERATED PDF(s) were generated. Proceeding with release."
          else
             echo "All documents built successfully ($PDFS_GENERATED PDFs)."
          fi

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p artifacts/pdfs artifacts/logs
          # Collect all PDFs
          # Collect only PDFs that have a matching .tex file in the same directory
          while IFS= read -r texfile; do
            dir=$(dirname "$texfile")
            name=$(basename "$texfile" .tex)
            if [ -f "${dir}/${name}.pdf" ]; then
              cp "${dir}/${name}.pdf" artifacts/pdfs/
            fi
          done < main_docs.txt
          # Collect logs
          cp build_logs/*.log artifacts/logs/ 2>/dev/null || true

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          retention-days: 90
          if-no-files-found: warn
          path: artifacts/pdfs/*.pdf

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 30
          if-no-files-found: ignore
          path: artifacts/logs/*.log

  prerelease:
    name: Create Prerelease
    needs: build
    runs-on: ubuntu-latest
    # Only create prereleases on pushes to main (not PRs or tags)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pdfs

      - name: Get current date and commit info
        id: info
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: List downloaded PDFs
        run: |
          echo "📄 PDFs to include in prerelease:"
          ls -la pdfs/ || echo "No PDFs found"

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist, otherwise edit it
          # We use --notes-file to handle multiline body safely
          
          # Prepare release body
          cat <<EOF > release_body.md
          ## 🔄 Automatic Prerelease
          
          **Build Date:** ${{ steps.info.outputs.datetime }}
          **Commit:** [`${{ steps.info.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          
          This is an automatically generated prerelease containing the latest compiled PDF documents.
          
          > ⚠️ **Note:** This prerelease is automatically updated with every commit to the main branch.
          > For stable versions, see the [official releases](https://github.com/${{ github.repository }}/releases?q=NOT+prerelease).
          
          ### 📥 Downloads
          All PDF summaries are attached below.
          EOF
          
          # Create or update the release metadata
          # We check if release exists first
          if gh release view latest >/dev/null 2>&1; then
             echo "Updating existing release..."
             gh release edit latest \
               --title "📚 Latest Build (${{ steps.info.outputs.date }})" \
               --prerelease \
               --draft=false \
               --notes-file release_body.md
          else
             echo "Creating new release..."
             gh release create latest \
               --title "📚 Latest Build (${{ steps.info.outputs.date }})" \
               --prerelease \
               --draft=false \
               --notes-file release_body.md
          fi
          
          # Upload assets with --clobber to overwrite proper existing files
          # We check for both pdfs in artifacts/pdfs and logs
          echo "Uploading assets..."
          
          # Upload PDFs (glob expansion happens in shell)
          if ls artifacts/pdfs/*.pdf 1> /dev/null 2>&1; then
            gh release upload latest artifacts/pdfs/*.pdf --clobber
          else
            echo "::warning::No PDFs found in artifacts/pdfs to upload"
          fi
          
          # Upload Logs if exist
          if ls artifacts/logs/*.log 1> /dev/null 2>&1; then
             gh release upload latest artifacts/logs/*.log --clobber
          fi
          fail_on_unmatched_files: false