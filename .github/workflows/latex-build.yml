name: Build LaTeX

on:
    push:
        branches: [main, master, MAIN]
        tags:
            - "v*"
    pull_request:
        branches: [main, master, MAIN]
    workflow_dispatch:

# Snel achter elkaar pushen startte vroeger evenveel volledige builds naast
# elkaar. Nu wordt een lopende build voor dezelfde ref afgebroken.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ------------------------------------------------------------------
    # Zoekt de hoofddocumenten op en geeft ze door als matrix-invoer, zodat
    # ze parallel gebouwd worden in plaats van in een seriele lus.
    # ------------------------------------------------------------------
    discover:
        name: Documenten zoeken
        runs-on: ubuntu-latest
        outputs:
            docs: ${{ steps.find.outputs.docs }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Hoofddocumenten zoeken
              id: find
              shell: bash
              run: |
                  # _OLD wordt niet meer onderhouden en compileert deels niet meer;
                  # meebouwen zou elke run rood maken zonder dat iemand er iets aan doet.
                  find . \( -name ".git" -o -name ".github" -o -name ".vscode" -o -name "assets" -o -name "_OLD" \) -prune -o \
                         -type f -name "*.tex" \
                         ! -name "*-macros.sty" \
                         -exec grep -l "\\documentclass" {} \; | sed 's|^\./||' | sort > main_docs.txt

                  echo "Gevonden documenten:"
                  cat main_docs.txt

                  # JSON-array van {path, slug}. De slug wordt gebruikt voor
                  # artifact- en cachenamen, die geen spaties of & mogen bevatten.
                  python3 - <<'PY' >> "$GITHUB_OUTPUT"
                  import json, re, io, os
                  docs = []
                  for line in io.open("main_docs.txt", encoding="utf-8"):
                      p = line.strip()
                      if not p:
                          continue
                      slug = re.sub(r'[^A-Za-z0-9._-]+', '_', os.path.splitext(p)[0]).strip('_')
                      docs.append({"path": p, "slug": slug})
                  print("docs=" + json.dumps(docs, separators=(",", ":")))
                  PY

    # ------------------------------------------------------------------
    # Een job per document. Elk document heeft zijn eigen cache-sleutel, zodat
    # een wijziging in een document de andere niet meer laat herbouwen.
    # ------------------------------------------------------------------
    build:
        name: ${{ matrix.doc.slug }}
        needs: discover
        if: needs.discover.outputs.docs != '[]'
        runs-on: ubuntu-latest
        container:
            image: texlive/texlive:latest
        strategy:
            fail-fast: false
            matrix:
                doc: ${{ fromJson(needs.discover.outputs.docs) }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Afhankelijkheden hashen
              id: hash
              shell: bash
              run: |
                  dir=$(dirname "${{ matrix.doc.path }}")

                  # De oude cache-sleutel hashte alleen het hoofdbestand en
                  # school-macros.sty. Wijzigingen in \input-hoofdstukken, in
                  # afbeeldingen of in de .bib gingen er dus niet in, waardoor de
                  # cache een verouderde PDF terugserveerde. Nu gaat de hele
                  # documentmap mee, plus de gedeelde macro's.
                  {
                      sha256sum school-macros.sty 2>/dev/null || true
                      find "$dir" -type f \
                           ! -name '*.pdf' ! -name '*.aux' ! -name '*.log' \
                           ! -name '*.out' ! -name '*.toc' ! -name '*.fls' \
                           ! -name '*.fdb_latexmk' ! -name '*.synctex.gz' \
                           -print0 | sort -z | xargs -0 -r sha256sum
                  } | sha256sum | cut -d' ' -f1 | sed 's/^/key=/' >> "$GITHUB_OUTPUT"

            - name: Cache van de PDF
              id: cache
              uses: actions/cache@v4
              with:
                  path: cached.pdf
                  key: pdf-${{ matrix.doc.slug }}-${{ steps.hash.outputs.key }}

            - name: Bouwen
              if: steps.cache.outputs.cache-hit != 'true'
              shell: bash
              run: |
                  dir=$(dirname "${{ matrix.doc.path }}")
                  file=$(basename "${{ matrix.doc.path }}")
                  name=$(basename "$file" .tex)
                  cd "$dir"

                  # Geen -shell-escape: geen enkel document gebruikt minted, svg,
                  # gnuplot of \write18, en het zet willekeurige shell-uitvoering aan.
                  if latexmk -pdf \
                      -interaction=nonstopmode \
                      -file-line-error \
                      "$file" 2>&1 | tee "build_${name}.log"; then
                      :
                  fi

                  if [ -f "${name}.pdf" ]; then
                      cp "${name}.pdf" "$GITHUB_WORKSPACE/cached.pdf"
                      echo "✅ ${{ matrix.doc.path }}" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "❌ ${{ matrix.doc.path }} — geen PDF geproduceerd" >> "$GITHUB_STEP_SUMMARY"
                      echo "::group::Foutdetails"
                      tail -40 "build_${name}.log" || true
                      [ -f "${name}.log" ] && grep -A3 "^!" "${name}.log" || true
                      echo "::endgroup::"
                      exit 1
                  fi

            - name: Uit cache halen
              if: steps.cache.outputs.cache-hit == 'true'
              shell: bash
              run: |
                  dir=$(dirname "${{ matrix.doc.path }}")
                  name=$(basename "${{ matrix.doc.path }}" .tex)
                  cp cached.pdf "${dir}/${name}.pdf"
                  echo "⚡ ${{ matrix.doc.path }} (uit cache)" >> "$GITHUB_STEP_SUMMARY"

            - name: PDF verzamelen
              if: always()
              shell: bash
              run: |
                  mkdir -p artifacts
                  dir=$(dirname "${{ matrix.doc.path }}")
                  name=$(basename "${{ matrix.doc.path }}" .tex)
                  [ -f "${dir}/${name}.pdf" ] && cp "${dir}/${name}.pdf" artifacts/ || true
                  cp "${dir}/build_${name}.log" artifacts/ 2>/dev/null || true

            - name: PDF uploaden
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pdf-latex-${{ matrix.doc.slug }}
                  path: artifacts/*.pdf
                  retention-days: 90
                  if-no-files-found: ignore

            - name: Buildlog uploaden
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: log-${{ matrix.doc.slug }}
                  path: artifacts/*.log
                  retention-days: 30
                  if-no-files-found: ignore

    typst:
        name: Build Typst
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Typst
              uses: typst-community/setup-typst@v3
              with:
                  cache-dependency-path: school-template.typ

            - name: Check available fonts
              run: |
                  echo "Listing fonts found in $GITHUB_WORKSPACE/fonts/:"
                  typst fonts --font-path "$GITHUB_WORKSPACE/fonts/"

            - name: Find and Build Typst documents
              shell: bash
              run: |
                  echo "## Typst Build Results 📊" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Document | Status | Details |" >> $GITHUB_STEP_SUMMARY
                  echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY

                  mkdir -p artifacts/pdfs

                  TYPST_BUILT=0
                  TYPST_FAILED=0

                  find . \( -name ".git" -o -name ".github" -o -name "chapters" -o -name "_OLD" \) -prune -o \
                       -type f -name "*.typ" \
                       ! -name "school-template.typ" \
                       -exec grep -l "#show: project" {} \; > typst_docs.txt 2>/dev/null || true

                  if [ ! -s typst_docs.txt ]; then
                    echo "No Typst main documents found."
                    echo "| - | ℹ️ | No Typst documents found |" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "📝 Found Typst documents:"
                    cat typst_docs.txt

                    while IFS= read -r typfile; do
                      dir=$(dirname "$typfile")
                      file=$(basename "$typfile")
                      name=$(basename "$typfile" .typ)

                      echo "========================================="
                      echo "Building Typst: $typfile"
                      echo "========================================="

                      cd "$dir"

                      if typst compile --root "$GITHUB_WORKSPACE" --font-path "$GITHUB_WORKSPACE/fonts/" "$file" 2>&1; then
                        if [ -f "${name}.pdf" ]; then
                          echo "| \`$name\` (Typst) | ✅ Built | PDF generated |" >> $GITHUB_STEP_SUMMARY
                          echo "✅ Success: $typfile"
                          cp "${name}.pdf" "$GITHUB_WORKSPACE/artifacts/pdfs/" || true
                          TYPST_BUILT=$((TYPST_BUILT + 1))
                        else
                          echo "| \`$name\` (Typst) | ⚠️ Warning | Completed but no PDF |" >> $GITHUB_STEP_SUMMARY
                          echo "⚠️ Warning: $typfile completed but PDF not found"
                          TYPST_FAILED=1
                        fi
                      else
                        echo "| \`$name\` (Typst) | ❌ Failed | Build error |" >> $GITHUB_STEP_SUMMARY
                        echo "❌ Failed: $typfile"
                        TYPST_FAILED=1
                      fi

                      cd - > /dev/null
                    done < typst_docs.txt
                  fi

                  echo ""
                  echo "📊 Typst Build Summary: $TYPST_BUILT PDFs built"

            - name: Upload Typst PDFs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pdf-typst
                  path: artifacts/pdfs/*.pdf
                  retention-days: 90
                  if-no-files-found: warn

    collect:
        name: Collect PDFs
        needs: [build, typst]
        if: always() && (needs.build.result == 'success' || needs.typst.result == 'success')
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download all PDF artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: pdf-*
                  path: artifacts/pdfs
                  merge-multiple: true

            - name: List collected PDFs
              run: |
                  echo "Collected PDFs (before rename):"
                  ls -la artifacts/pdfs || echo "No PDFs collected"

            - name: Build structured bundle (year folders + update scripts)
              shell: bash
              run: |
                  python3 .github/build_bundle.py artifacts/pdfs bundle

            - name: Upload structured bundle
              uses: actions/upload-artifact@v4
              with:
                  name: Samenvattingen Industriele Ingenieurs KULeuven
                  path: bundle/
                  retention-days: 90
                  if-no-files-found: warn

    prerelease:
        name: Create Prerelease
        needs: [build, typst, collect]
        # Only create prereleases on pushes to main, and only if collect succeeded
        if: always() && needs.collect.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/MAIN'
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download PDF artifacts
              uses: actions/download-artifact@v4
              with:
                  name: Samenvattingen Industriele Ingenieurs KULeuven
                  path: artifacts/pdfs

            - name: Get current date and commit info
              id: info
              shell: bash
              run: |
                  echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
                  echo "datetime=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
                  echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: List downloaded PDFs
              run: |
                  echo "PDFs to include in prerelease:"
                  ls -la artifacts/pdfs/ || echo "No PDFs found"

            - name: Create or Update Release
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # 1. Update the 'latest' tag to point to this commit
                  # We need to configure git identity for the tag
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  echo "Updating 'latest' tag to $(git rev-parse --short HEAD)..."
                  git tag -f latest
                  git push -f origin latest

                  # 2. Prepare Release Body using printf to avoid heredoc indentation issues
                  printf '%s\n\n' "## <img src='https://api.iconify.design/material-symbols/autorenew.svg?color=gray' height='22'> Automatic Prerelease" > release_body.md
                  printf "**Build Date:** ${{ steps.info.outputs.datetime }}\n" >> release_body.md
                  printf "**Commit:** [\`${{ steps.info.outputs.short_sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\n\n" >> release_body.md
                  printf "This is an automatically generated prerelease containing the latest compiled PDF documents.\n\n" >> release_body.md
                  printf '%s\n' "> <img src='https://api.iconify.design/material-symbols/warning-outline.svg?color=gray' height='16'> **Note:** This prerelease is automatically updated with every commit to the main branch." >> release_body.md
                  printf "> For stable versions, see the [official releases](https://github.com/${{ github.repository }}/releases?q=NOT+prerelease).\n\n" >> release_body.md
                  printf '%s\n%s\n\n' "### <img src='https://api.iconify.design/material-symbols/download.svg?color=gray' height='20'> Downloads" "All PDF summaries are attached below." >> release_body.md
                  printf "**Update scripts** are also attached — download into a folder and run to fetch/update every summary, organized per year:\n" >> release_body.md
                  printf '%s\n' "- Linux / macOS: \`update.sh\`  (run \`bash update.sh\`)" >> release_body.md
                  printf '%s\n' "- Windows: \`update.ps1\`  (right-click -> Run with PowerShell)" >> release_body.md

                  # 3. Create or Recreate the Release
                  # We delete the old release and create a fresh one to ensure
                  # the release date is updated.
                  if gh release view latest >/dev/null 2>&1; then
                     echo "Deleting old automated release..."
                     gh release delete latest --yes
                  fi

                  echo "Creating fresh release..."
                  gh release create latest \
                    --title "Latest Build (${{ steps.info.outputs.date }})" \
                    --prerelease \
                    --latest \
                    --draft=false \
                    --notes-file release_body.md

                  # 4. Delete old assets so stale PDFs don't linger
                  echo "🧹 Cleaning old release assets..."
                  # Get asset list and delete them one by one
                  assets=$(gh release view latest --json assets -q '.assets[].name' 2>/dev/null)
                  for asset in $assets; do
                    [ -z "$asset" ] && continue
                    echo "  Removing old asset: $asset"
                    gh release delete-asset latest "$asset" --yes 2>/dev/null || true
                  done

                  # 5. Rename assets to use underscores (ensure consistency)
                  echo "Renaming assets to use underscores..."
                  if [ -d artifacts ]; then
                    find artifacts -type f -name "* *" -print0 | while IFS= read -r -d '' f; do
                      new_name="${f// /_}"
                      echo "  Renaming '$f' to '$new_name'"
                      mv "$f" "$new_name"
                    done
                  fi

                  # 6. Upload fresh assets
                  echo "Uploading assets..."
                  # The bundle is organized into year folders, so search recursively.
                  # Release assets are flat, individual PDFs.
                  if find artifacts/pdfs -type f -name '*.pdf' | grep -q .; then
                    find artifacts/pdfs -type f -name '*.pdf' -exec gh release upload latest {} --clobber ';'
                  else
                    echo "::warning::No PDFs found to upload."
                  fi

                  # Upload the manifest (pdf -> year map) used by the update scripts.
                  if [ -f artifacts/pdfs/manifest.tsv ]; then
                    gh release upload latest artifacts/pdfs/manifest.tsv --clobber
                  fi

                  # Upload the update / sync scripts so users can grab the
                  # latest version straight from the release.
                  echo "Uploading update scripts..."
                  for script in update.sh update.ps1; do
                    if [ -f "$script" ]; then
                      gh release upload latest "$script" --clobber
                    else
                      echo "::warning::$script not found, skipping."
                    fi
                  done

                  # Check for Logs (if any were collected and downloaded)
                  if ls artifacts/logs/*.log 1> /dev/null 2>&1; then
                     gh release upload latest artifacts/logs/*.log --clobber
                  fi
