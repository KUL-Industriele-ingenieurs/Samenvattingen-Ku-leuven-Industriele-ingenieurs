name: Build LaTeX

on:
  push:
    branches: [ main, master, MAIN ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, MAIN ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: miktex/miktex:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize MiKTeX
        run: |
          miktexsetup finish
          # Enable auto-install with verbose logging
          initexmf --admin --set-config-value=[MPM]AutoInstall=1
          initexmf --admin --set-config-value=[MPM]AutoInstallDirectory=/opt/miktex/texmfs/install
          mpm --admin --update-db
          
          # Verify auto-install is working
          echo "MiKTeX AutoInstall Status:"
          initexmf --admin --show-config-value=[MPM]AutoInstall
          
          initexmf --admin --update-fndb
          initexmf --admin --mkmaps

      - name: Clean any stale artifacts from checkout
        run: |
          # Remove any auxiliary files that might have been accidentally committed
          find . -type f \( \
            -name "*.aux" -o \
            -name "*.bbl" -o \
            -name "*.bcf" -o \
            -name "*.blg" -o \
            -name "*.fls" -o \
            -name "*.log" -o \
            -name "*.out" -o \
            -name "*.toc" -o \
            -name "*.fdb_latexmk" -o \
            -name "*.synctex.gz" \
          \) -delete
          echo "Cleaned stale auxiliary files"

      - name: Find and Build LaTeX documents
        run: |
          # Find all main documents (excluding subfiles and templates)
          find . -type f -name "*.tex" \
            ! -path "*/.git/*" \
            ! -path "*/assets/*" \
            ! -name "school-macros.sty" \
            ! -name "*-macros.sty" \
            ! -name "Examenoefening.tex" \
            -exec grep -l "\\documentclass" {} \; > main_docs.txt
          
          echo "## Build Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Document | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          
          BUILD_FAILED=0
          BUILD_LOG_DIR="${GITHUB_WORKSPACE}/build_logs"
          mkdir -p "$BUILD_LOG_DIR"
          
          # Build each found document
          while IFS= read -r texfile; do
            dir=$(dirname "$texfile")
            file=$(basename "$texfile")
            name=$(basename "$texfile" .tex)
            
            echo "========================================="
            echo "Building: $texfile"
            echo "========================================="
            
            cd "$dir"
            
            # Clean auxiliary files before building to ensure fresh state
            latexmk -C "$file" 2>/dev/null || true
            
            # Build with detailed error logging
            # latexmk automatically runs pdflatex/biber as many times as needed (usually 2-3 times)
            # to resolve Table of Contents, cross-references, and the custom \frm system.
            if latexmk -pdf \
                -shell-escape \
                -interaction=nonstopmode \
                -file-line-error \
                "$file" 2>&1 | tee "build_${name}.log"; then
              
              # Verify PDF was actually created
              if [ -f "${name}.pdf" ]; then
                echo "| \`$name\` | ✅ Success | PDF generated |" >> $GITHUB_STEP_SUMMARY
                echo "✅ Success: $texfile"
              else
                echo "| \`$name\` | ⚠️ Warning | Completed but no PDF |" >> $GITHUB_STEP_SUMMARY
                echo "⚠️ Warning: $texfile completed but PDF not found"
                BUILD_FAILED=1
              fi
            else
              EXIT_CODE=$?
              echo "| \`$name\` | ❌ Failed | Exit code: $EXIT_CODE |" >> $GITHUB_STEP_SUMMARY
              echo "❌ Failed: $texfile (exit code: $EXIT_CODE)"
              
              # Extract and display key error information for the Actions UI
              echo "::group::Error details for $name"
              echo "Last 30 lines of build log:"
              tail -30 "build_${name}.log" || true
              
              if [ -f "${name}.log" ]; then
                echo ""
                echo "LaTeX errors found in .log file:"
                grep -A 3 "^!" "${name}.log" || echo "No '!' markers found in .log"
              fi
              echo "::endgroup::"
              
              BUILD_FAILED=1
            fi
            
            # Move log to central dir for artifact collection
            cp "build_${name}.log" "$BUILD_LOG_DIR/" 2>/dev/null || true
            
            cd - > /dev/null
          done < main_docs.txt
          
          # Fail the job if any build failed
          if [ $BUILD_FAILED -ne 0 ]; then
            echo "::error::One or more LaTeX documents failed to build"
            exit 1
          fi

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p artifacts/pdfs artifacts/logs
          # Collect all PDFs
          find . -type f -name "*.pdf" \
            ! -path "*/.git/*" \
            ! -path "*/assets/*" \
            -exec cp {} artifacts/pdfs/ \; || true
          # Collect logs
          cp build_logs/*.log artifacts/logs/ 2>/dev/null || true

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          retention-days: 90
          if-no-files-found: warn
          path: artifacts/pdfs/*.pdf

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 30
          if-no-files-found: ignore
          path: artifacts/logs/*.log