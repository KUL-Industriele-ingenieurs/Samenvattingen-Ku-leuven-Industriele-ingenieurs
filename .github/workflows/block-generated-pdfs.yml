name: Block generated PDFs

on:
  push:
  pull_request:

jobs:
  block-generated-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for generated PDFs
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF" --depth=1
            CHANGED=$(git diff --name-only origin/$BASE_REF...HEAD)
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              git fetch origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" --depth=1
              BASE_COMMIT=$(git merge-base "origin/$DEFAULT_BRANCH" "$AFTER")
              CHANGED=$(git diff --name-only "$BASE_COMMIT" "$AFTER")
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            fi
          fi

          echo "Changed files:\n$CHANGED"

          # Find changed PDFs (case-insensitive)
          BAD=()
          while IFS= read -r file; do
            case "$file" in
              *.[Pp][Dd][Ff])
                tex_file="${file%.*}.tex"
                typ_file="${file%.*}.typ"
                if [ -f "$tex_file" ] || [ -f "$typ_file" ]; then
                  BAD+=("$file")
                fi
                ;;
            esac
          done <<< "$CHANGED"

          if [ ${#BAD[@]} -gt 0 ]; then
            echo -e "\n🛑 ERROR: The following generated PDFs were changed and match existing .tex or .typ source files:" >&2
            for f in "${BAD[@]}"; do
              tex_file="${f%.*}.tex"
              typ_file="${f%.*}.typ"
              if [ -f "$tex_file" ]; then
                echo "  - PDF: '$f' (Matches source: '$tex_file')" >&2
              else
                echo "  - PDF: '$f' (Matches source: '$typ_file')" >&2
              fi
            done
            echo -e "\nPlease remove these generated PDFs from your commit (git restore --staged <file> or git reset HEAD <file>) and push again." >&2
            exit 1
          fi

          echo "No disallowed generated PDFs found."
