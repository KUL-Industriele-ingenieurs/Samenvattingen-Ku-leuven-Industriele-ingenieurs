name: PNG's lossless verkleinen

# oxipng herschrijft gewijzigde PNG's lossless: pixels blijven identiek, het
# bestand wordt kleiner. Zo groeit de repo trager.
# - Op een PR: commit naar de branch van de PR (zoals update-readme.yml).
# - Na een directe push naar MAIN: een bot-PR via de merge queue, want de
#   ruleset van MAIN weigert een directe push vanuit een workflow.
#   Eén vaste branch (bot/png-verkleinen) die elke run opnieuw van MAIN vertrekt
#   en geforceerd gepusht wordt: er is dus nooit meer dan één open bot-PR en die
#   kan niet in conflict raken met latere pushes.
# - workflow_dispatch: alle PNG's in de repo, ook via een bot-PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['**.png', '**.PNG']
  push:
    branches: [MAIN]
    paths: ['**.png', '**.PNG']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: optimize-png-${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  optimize:
    runs-on: ubuntu-latest
    # Een fork kan niet naar zijn eigen branch gepusht worden vanuit deze repo.
    # De merge van een eigen bot-PR overslaan: die PNG's zijn al verkleind.
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.head.ref != 'bot/png-verkleinen'))
      && !contains(github.event.head_commit.message, 'bot/png-verkleinen')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - name: oxipng installeren
        # Ubuntu heeft geen oxipng-pakket; Rust staat wel op de runner.
        run: cargo install oxipng --locked --version "^10"

      - name: Gewijzigde PNG's verkleinen
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
              git ls-files -z '*.png' '*.PNG' > files.lst
          else
              # Alleen de basiscommit ophalen: genoeg om de twee trees te vergelijken.
              git fetch -q --depth=1 origin "$BASE"
              git diff -z --name-only --diff-filter=AM "$BASE" HEAD -- '*.png' '*.PNG' > files.lst
              if [ "${{ github.event_name }}" = push ]; then
                  # Een nog openstaande bot-PR wordt opnieuw opgebouwd: zijn PNG's er weer bij nemen.
                  gh pr diff bot/png-verkleinen --name-only 2>/dev/null | grep -iE '\.png$' | while IFS= read -r f; do
                      [ -f "$f" ] && printf '%s\0' "$f"
                  done >> files.lst || true
              fi
          fi
          echo "$(tr -cd '\0' < files.lst | wc -c) PNG's te verwerken"
          # --strip safe: metadata weg, kleurprofiel blijft. Zonder --zopfli: dat is 10x+ trager voor een paar % extra.
          xargs -0 -r oxipng -q -o max --strip safe < files.lst
          rm files.lst
          git diff --shortstat

      - name: Committen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Zonder pathspec: '*.PNG' faalt met exit 128 als er geen .PNG bestaat; oxipng raakt toch alleen PNG's aan.
          git add -u
          if git diff --staged --quiet; then
              echo "Niets te verkleinen"; exit 0
          fi
          msg="png: lossless verkleind met oxipng"
          if [ "${{ github.event_name }}" = pull_request ]; then
              git commit -qm "$msg" && git push
          else
              branch=bot/png-verkleinen
              git switch -qC "$branch" && git commit -qm "$msg" && git push -q --force origin "$branch"
              if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
                  gh pr create --base MAIN --head "$branch" --title "$msg" \
                      --body "Automatisch door optimize-png.yml. Lossless: pixels identiek."
              fi
              gh pr merge "$branch" --merge --auto
          fi
