name: Auto Label Code Issues

on:
  issues:
    types: [opened, reopened]
  pull_request:
    branches: [main, MAIN, master]
  workflow_dispatch:

jobs:
  auto-label-and-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label and Assign
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue payload found. If this is a manual run, this is expected behavior as there is no issue context.");
              return;
            }

            const issueNumber = issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const creator = issue.user.login;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['from-code']
            });

            const commentBody = [
              `Thanks for reporting this issue! 🚀`,
              '',
              'To start working on this:',
              '1. Go to the **Source Control** tab in VS Code.',
              '2. Expand the **GITHUB** section.',
              '3. Find this issue and click the arrow icon (➥) to **Start working on issue**.',
              '',
              `This will automatically create a branch \`issue-${issueNumber}\` for you to work in.`
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: commentBody
            });
