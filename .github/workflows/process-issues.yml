name: Process issues for code permalinks

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_body:
        description: 'Body of the issue to test'
        required: true

permissions:
  issues: write
  contents: read

jobs:
  process-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process open issues and ensure permalinks
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const repoRoot = process.cwd();

            async function findFileAndLineFromIssueBody(body) {
              const codeFenceMatch = body.match(/```(?:\w*\n)?([\s\S]*?)```/);
              let markerLine = null;
              if (codeFenceMatch) {
                const codeBlock = codeFenceMatch[1];
                const codeLines = codeBlock.split(/\r?\n/);
                markerLine = codeLines.find(l => /(@issue:|@todo:|TODO|FIXME)/i.test(l.trim()));
              }

              const fileLineMatch = body.match(/In file\s+(.+)/);
              let relPath = undefined;
              if (fileLineMatch) {
                const m = fileLineMatch[1].match(/([^\r\n]*?\.tex)/i);
                if (m) relPath = m[1].trim();
                else relPath = fileLineMatch[1].trim().replace(/\r$/, '');
              }

              let lineNumber = undefined;
              let finalPath = undefined;

              // 1. Try to resolve the path if we have one
              if (relPath) {
                if (fs.existsSync(path.join(repoRoot, relPath))) {
                  finalPath = relPath;
                } else {
                  // Fuzzy search for path suffix or basename
                  const normalizedSearch = relPath.replace(/\\/g, '/').toLowerCase();
                  const searchBasename = path.basename(normalizedSearch);
                  
                  // Helper to walk and find .tex files
                  function walk(dir) {
                    let results = [];
                    try {
                      const list = fs.readdirSync(dir);
                      for (const file of list) {
                        if (file === '.git' || file === 'node_modules') continue;
                        const fullPath = path.join(dir, file);
                        const stat = fs.statSync(fullPath);
                        if (stat && stat.isDirectory()) {
                          results = results.concat(walk(fullPath));
                        } else if (file.toLowerCase().endsWith('.tex')) {
                          results.push(path.relative(repoRoot, fullPath).replace(/\\/g, '/'));
                        }
                      }
                    } catch (e) { /* ignore access errors */ }
                    return results;
                  }
                  
                  const allTexFiles = walk(repoRoot);
                  
                  // 1a. Suffix match (e.g. 'math/file.tex' matches '2de jaar/math/file.tex')
                  const suffixMatches = allTexFiles.filter(p => p.toLowerCase().endsWith(normalizedSearch));
                  if (suffixMatches.length > 0) {
                     finalPath = suffixMatches[0];
                  } else {
                     // 1b. Basename match
                     const basenameMatches = allTexFiles.filter(p => path.basename(p).toLowerCase() === searchBasename);
                     if (basenameMatches.length > 0) {
                        finalPath = basenameMatches[0];
                     }
                  }
                }
              }

              // 2. If no path found or we want to search by marker purely (fallback)
              // The original logic searched all files if !relPath && markerLine. 
              // We should keep that capability if finalPath is still undefined.
              if (!finalPath && markerLine) {
                 const cleaned = markerLine.replace(/^\s*%?\s*/, '').trim();
                 function walkSearch(dir) {
                    const dirents = fs.readdirSync(dir, { withFileTypes: true });
                    for (const d of dirents) {
                      const p = path.join(dir, d.name);
                      if (d.isDirectory()) {
                        if (d.name === '.git' || d.name === 'node_modules') continue;
                        const res = walkSearch(p);
                        if (res) return res;
                      } else if (d.isFile() && p.toLowerCase().endsWith('.tex')) {
                        const content = fs.readFileSync(p, 'utf8');
                        const lines = content.split(/\r?\n/);
                        for (let i = 0; i < lines.length; i++) {
                          const L = lines[i];
                          if (L.includes(cleaned) || /(@issue|@todo|TODO|FIXME)/i.test(L) && (cleaned.length < 10 || L.includes(cleaned.split(/\s+/)[0]))) {
                            return { file: p, line: i + 1 };
                          }
                        }
                      }
                    }
                    return null;
                  }
                  const found = walkSearch(repoRoot);
                  if (found) {
                    finalPath = path.relative(repoRoot, found.file).replace(/\\/g, '/');
                    lineNumber = found.line;
                  }
              }

              // 3. If we have a finalPath, find the line number
              if (finalPath && lineNumber === undefined) {
                  const filePath = path.join(repoRoot, finalPath);
                  if (fs.existsSync(filePath)) {
                    const content = fs.readFileSync(filePath, 'utf8');
                    const lines = content.split(/\r?\n/);
                    if (markerLine) {
                      const cleaned = markerLine.replace(/^\s*%?\s*/, '').trim();
                      for (let i = 0; i < lines.length; i++) {
                        if (lines[i].includes(cleaned) || lines[i].trim() === markerLine.trim() || (lines[i].includes('@issue') && lines[i].includes(cleaned.replace(/.*@issue[:\s]*/, '')))) {
                          lineNumber = i + 1;
                          break;
                        }
                      }
                    }
                    if (!lineNumber) {
                       for (let i = 0; i < lines.length; i++) {
                         if (/(@issue|@todo|TODO|FIXME)/i.test(lines[i])) {
                           lineNumber = i + 1;
                           break;
                         }
                       }
                    }
                  }
              }

              return { relPath: finalPath, lineNumber };
            }

            async function processIssue(issue) {
              const body = issue.body || '';
              if (!body || (!body.includes('@issue') && !body.includes('@todo') && !/```/.test(body))) return false;

              const { relPath, lineNumber } = await findFileAndLineFromIssueBody(body);
              if (!relPath || !lineNumber) {
                core.info(`No file/line for issue #${issue.number}`);
                return false;
              }
              
              if (issue.number === 0) {
                 core.info(`[Dry Run] Found match for manual input: ${relPath}#L${lineNumber}`);
                 return true;
              }

              const repoInfo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
              const defaultBranch = repoInfo.data.default_branch || 'MAIN';
              const blobUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${defaultBranch}/${relPath}#L${lineNumber}`;

              const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number });
              const already = comments.data.some(c => c.body && c.body.includes(blobUrl));
              if (!already) {
                const commentBody = `🔗 Code permalink: ${blobUrl}\n\n_(Automatically added from file marker)_`;
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: commentBody });
                try {
                  await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: ['from-code'] });
                } catch (err) {
                  core.info('Failed to add label: ' + err.message);
                }
                core.info(`Added permalink for issue #${issue.number}`);
                return true;
              }
              return false;
            }

            // Process either a specific issue (manual) or all open issues
            if (context.eventName === 'workflow_dispatch' && context.payload.inputs && context.payload.inputs.issue_body) {
              const dummy = { number: 0, body: context.payload.inputs.issue_body };
              await processIssue(dummy);
              return;
            }

            let page = 1;
            const logEntries = [];
            while (true) {
              const res = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100, page });
              if (!res.data || res.data.length === 0) break;
              for (const issue of res.data) {
                const action = await processIssue(issue);
                if (action) {
                  logEntries.push({ number: issue.number, title: issue.title, action, url: issue.html_url });
                }
              }
              page++;
            }

            // If we have entries, generate a markdown summary, save it, upload later and comment on or create a 'permalink-log' issue
            if (logEntries.length > 0) {
              const now = new Date().toISOString();
              const filename = `permalink-logs/permalink-log-${now.replace(/[:.]/g,'-')}.md`;
              const header = `# Permalink Log - ${now}\n\n`;
              const tableHeader = `| Issue | Title | Action |\n|---|---|---|\n`;
              const rows = logEntries.map(e => `| [#${e.number}](${e.url}) | ${e.title.replace(/\|/g,'\\|')} | ${e.action} |`).join('\n');
              const md = header + tableHeader + rows + '\n';
              fs.mkdirSync(path.dirname(filename), { recursive: true });
              fs.writeFileSync(filename, md, 'utf8');

              // Try to find an existing 'permalink-log' issue (open) to append to; otherwise create one
              const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
              const logIssue = issues.data.find(i => i.title && i.title.toLowerCase() === 'permalink-log');
              const commentBody = `## Permalink run (${now})\n\nSummary of updated issues:\n\n${tableHeader}${rows}\n\n(Full artifact attached to the workflow run)`;
              if (logIssue) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: logIssue.number, body: commentBody });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'permalink-log', body: `This issue contains automated logs of permalink workflow runs.\n\nFirst run: ${now}` });
                const issues2 = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
                const created = issues2.data.find(i => i.title && i.title.toLowerCase() === 'permalink-log');
                if (created) {
                  await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: created.number, body: commentBody });
                }
              }

              core.info(`Wrote log to ${filename} and posted summary comment`);
              // expose the filename so it can be picked up by the next step
              core.setOutput('log-file', filename);
            } else {
              core.info('No issues processed; no log written');
            }

      - name: Upload permalink log artifact
        if: steps.process.outputs.log-file
        uses: actions/upload-artifact@v4
        with:
          name: permalink-log
          path: ${{ steps.process.outputs.log-file }}
