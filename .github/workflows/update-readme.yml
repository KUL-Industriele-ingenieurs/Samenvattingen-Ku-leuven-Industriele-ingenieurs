name: Update README Course Overview

on:
  push:
    branches:
      - main
      - MAIN
    paths:
      - '*jaar**/**'
      - '.github/workflows/update-readme.yml'
      - '.github/generate_readme_overview.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate Course Markdown
        run: python3 .github/generate_readme_overview.py README.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-update course overview in README"
            git push
          fi
