name: Add code permalinks to issues

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

jobs:
  add-permalink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add permalink comment for @issue/@todo
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issue = context.payload.issue;
            if (!issue) {
              core.info('No issue payload available');
              return;
            }

            const body = issue.body || '';

            // Extract code fence block (first one) and the file line
            const codeFenceMatch = body.match(/```(?:\w*\n)?([\s\S]*?)```/);
            let markerLine = null;
            if (codeFenceMatch) {
              const codeBlock = codeFenceMatch[1];
              const codeLines = codeBlock.split(/\r?\n/);
              markerLine = codeLines.find(l => l.trim().startsWith('% @issue') || l.trim().startsWith('% @todo') || /@issue:/.test(l) || /@todo:/.test(l));
            }

            // Try to find the "In file <path>" line and extract a .tex path if present
            const fileLineMatch = body.match(/In file\s+(.+)/);

            const repoRoot = process.cwd();
            let relPath = undefined;
            if (fileLineMatch) {
              // Extract a substring that looks like a .tex path (be resilient against 'undefined' or extra text)
              const m = fileLineMatch[1].match(/([^\r\n]*?\.tex)/i);
              if (m) {
                relPath = m[1].trim();
              } else {
                // fallback: take the whole captured text but sanitize
                relPath = fileLineMatch[1].trim().replace(/\r$/, '');
              }
            }

            // If we still have no path, attempt to locate a file in the repo by searching for the marker text
            let lineNumber = undefined;
            if (!relPath && markerLine) {
              const cleaned = markerLine.replace(/^\s*%?\s*/, '').trim();
              // Search all .tex files for a line containing the cleaned marker or @issue/@todo
              const walk = (dir) => {
                const dirents = fs.readdirSync(dir, { withFileTypes: true });
                for (const d of dirents) {
                  const p = path.join(dir, d.name);
                  if (d.isDirectory()) {
                    // skip .git and node_modules to keep it fast
                    if (d.name === '.git' || d.name === 'node_modules') continue;
                    const res = walk(p);
                    if (res) return res;
                  } else if (d.isFile() && p.toLowerCase().endsWith('.tex')) {
                    const content = fs.readFileSync(p, 'utf8');
                    const lines = content.split(/\r?\n/);
                    for (let i = 0; i < lines.length; i++) {
                      const L = lines[i];
                      if (L.includes(cleaned) || (L.includes('@issue') || L.includes('@todo')) && (cleaned.length < 10 || L.includes(cleaned.split(/\s+/)[0]))) {
                        return { file: p, line: i + 1 };
                      }
                    }
                  }
                }
                return null;
              };
              const found = walk(repoRoot);
              if (found) {
                relPath = path.relative(repoRoot, found.file).replace(/\\/g, '/');
                lineNumber = found.line;
              }
            }

            // If we have a file path, try to resolve it and search for the exact marker
            if (relPath && lineNumber === undefined) {
              const filePath = path.join(repoRoot, relPath);
              if (fs.existsSync(filePath)) {
                const content = fs.readFileSync(filePath, 'utf8');
                const lines = content.split(/\r?\n/);
                if (markerLine) {
                  // clean marker for searching
                  const cleaned = markerLine.replace(/^\s*%?\s*/, '').trim();
                  // try exact match or contains
                  for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(cleaned) || lines[i].trim() === markerLine.trim() || (lines[i].includes('@issue') && lines[i].includes(cleaned.replace(/.*@issue[:\s]*/, '')))) {
                      lineNumber = i + 1;
                      break;
                    }
                  }
                }

                // fallback: first occurrence of @issue or @todo
                if (!lineNumber) {
                  for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('@issue') || lines[i].includes('@todo')) {
                      lineNumber = i + 1;
                      break;
                    }
                  }
                }
              } else {
                core.info(`File not found in repo: ${filePath}`);
              }
            }

            // Get default branch for use in blob url
            const repo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            const defaultBranch = repo.data.default_branch || 'MAIN';

            if (relPath && lineNumber) {
              const blobUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${defaultBranch}/${relPath}#L${lineNumber}`;

              // Avoid duplicating the comment: check existing comments for our permalink
              const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number });
              const already = comments.data.some(c => c.body && c.body.includes(blobUrl));
              if (!already) {
                const commentBody = `🔗 Code permalink: ${blobUrl}\n\n_(Automatically added from file marker)_.';
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: commentBody });
                // add a label to mark from-code issues
                try {
                  await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: ['from-code'] });
                } catch (err) {
                  core.info('Failed to add label: ' + err.message);
                }
              } else {
                core.info('Permalink already present in comments');
              }
            } else if (relPath && !lineNumber) {
              // file present but couldn't find marker
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Could not locate the marker line in \n\nthe file \n\nthe specified file: \n\ntypo? Please ensure the file is committed and that the @issue line exists.` });
            } else {
              core.info('No actionable data found to add permalink');
            }